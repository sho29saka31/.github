name: 機能要望
description: 新機能や改善を提案する
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: この提案が解決する課題や背景を説明してください。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 提案する解決策
      description: どのような機能・変更を追加したいか記載してください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 検討した他の選択肢があれば記載してください。
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: 補足
    validations:
      required: false
